{% extends "recipes/base.html" %}

{% block content %}
    {% for recipe in recipes %}
        <div class = "card mb-3">
            <div class = "row g-0">
                <div class = "col-md-2"> 
                    <a href = "{% url 'recipes:recipeDetails' recipe.recipeID %}">
                        {% if recipe.image %}
                            <img src = "{{recipe.image.url}}" class = "img-fluid rounded-start" alt = "Recipe Card">
                        {% else %}
                            <p class = "text-center">No Image</p>
                        {% endif %}
                    </a>                               
                </div>
                <div class = "col-md-10">
                    <div class = "card-body">
                        <a class = "font-h title-link" href = "{% url 'recipes:recipeDetails' recipe.recipeID %}">{{ recipe.title }}</a>
                        <p class = "card-text">{{recipe.getDescription}}</p>
                        <p class = "card-text"><small class = "text-body-secondary">{{recipe.createdAt}}</small></p>
                    </div>                                    
                </div>
            </div>
        </div>
    {% endfor %}
{% endblock %}
